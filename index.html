<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMINA Audio</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <section class="hero">
      <img class="hero-logo" src="img/icons/logo-light.svg" alt="Logo of LUMINA Audio" />
      <div class="hero-content">
        <div class="hero-content-about"> 
          <h1 class="hero-content-title">Musikken bygget til livet omkring dig</h1>
          <p class="hero-content-text">
            LUMINA One er mere end bare en højtaler. Fra spontane fester til rolige
            aftener skaber den glæde, fællesskab og minder der varer ved.
          </p>
        </div>
        
        <div class="hero-social">
          <img src="img/testimonial-profile/hero-social-trust.png" alt="Image of 3 diffrent girls taken in portrait">
          <div class="hero-social-info">
            <p class="hero-social-submitet">200k+</p>
            <p>Mere end 200 tusind øjeblikke fyldt med musik og glæde.</p>
          </div>
        </div>

        <div class="hero-cta">
          <button class="btn">Gøre hvert øjeblik levende</button>
          <p class="hero-cta-price">1440,-</p>
        </div>
      </div>
    </section>
  </body>
</html>
